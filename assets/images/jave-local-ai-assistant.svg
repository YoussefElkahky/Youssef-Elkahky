<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d" font-family="ui-monospace,Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">JAVE — Local AI Assistant</title>
  <desc id="d">A chat window next to a diagram: VS Code connects over WebSocket to the JAVE Go core, which talks to Ollama and a Docker sandbox.</desc>
  <defs>
    <radialGradient id="glow" cx="88%" cy="0%" r="95%">
      <stop offset="0" stop-color="#b3122a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#b3122a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3"><circle cx="3" cy="3" r="2.2" fill="#e23a52"/></marker>
  </defs>

  <rect width="640" height="360" fill="#0b0809"/>
  <rect width="640" height="360" fill="url(#grid)"/>
  <rect width="640" height="360" fill="url(#glow)"/>

  <!-- Chat window -->
  <g>
    <rect x="32" y="34" width="262" height="276" rx="12" fill="#120d0e" stroke="#fff" stroke-opacity=".14"/>
    <path d="M32 66H294" stroke="#fff" stroke-opacity=".12"/>
    <circle cx="52" cy="50" r="4.5" fill="#b3122a"/><circle cx="68" cy="50" r="4.5" fill="#3a3436"/><circle cx="84" cy="50" r="4.5" fill="#3a3436"/>
    <text x="104" y="54" font-size="11" fill="#a09a9a">jave · local</text>

    <!-- user message -->
    <rect x="112" y="82" width="166" height="34" rx="8" fill="#241c1e"/>
    <rect x="124" y="93" width="120" height="5" rx="2.5" fill="#a09a9a" opacity=".7"/>
    <rect x="124" y="103" width="80" height="5" rx="2.5" fill="#a09a9a" opacity=".5"/>

    <!-- assistant message -->
    <rect x="48" y="128" width="200" height="62" rx="8" fill="#1d0b10" stroke="#b3122a" stroke-opacity=".7"/>
    <rect x="60" y="140" width="170" height="5" rx="2.5" fill="#f0ebe7" opacity=".8"/>
    <rect x="60" y="151" width="146" height="5" rx="2.5" fill="#f0ebe7" opacity=".6"/>
    <rect x="60" y="162" width="160" height="5" rx="2.5" fill="#f0ebe7" opacity=".6"/>
    <rect x="60" y="173" width="92" height="5" rx="2.5" fill="#e23a52" opacity=".9"/>

    <!-- workspace context chip -->
    <rect x="48" y="204" width="230" height="46" rx="8" fill="none" stroke="#fff" stroke-opacity=".14" stroke-dasharray="4 4"/>
    <text x="60" y="222" font-size="10.5" fill="#e23a52">workspace context</text>
    <text x="60" y="238" font-size="10.5" fill="#a09a9a">project tree · history · files</text>

    <!-- input -->
    <rect x="48" y="266" width="198" height="30" rx="15" fill="#080606" stroke="#fff" stroke-opacity=".14"/>
    <rect x="60" y="279" width="64" height="4" rx="2" fill="#a09a9a" opacity=".5"/>
    <circle cx="263" cy="281" r="15" fill="#b3122a"/>
    <path d="M257 281h12m-5-5l5 5-5 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Architecture -->
  <g fill="none" stroke="#b3122a" stroke-width="1.5">
    <!-- connections -->
    <path d="M470 90V138" stroke-dasharray="4 4" marker-start="url(#dot)" marker-end="url(#dot)"/>
    <path d="M440 202L396 252" stroke-dasharray="4 4" marker-end="url(#dot)"/>
    <path d="M500 202L544 252" stroke-dasharray="4 4" marker-end="url(#dot)"/>

    <!-- nodes -->
    <rect x="404" y="46" width="132" height="44" rx="8" fill="#140f10"/>
    <rect x="384" y="140" width="172" height="62" rx="10" fill="#1d0b10" stroke-width="2"/>
    <rect x="334" y="254" width="124" height="44" rx="8" fill="#140f10"/>
    <rect x="484" y="254" width="130" height="44" rx="8" fill="#140f10" stroke-dasharray="3 3"/>
  </g>
  <g fill="#f0ebe7" text-anchor="middle" font-size="13">
    <text x="470" y="73">VS Code</text>
    <text x="470" y="167" font-size="20" font-weight="700" font-family="system-ui,Segoe UI,Arial,sans-serif" letter-spacing="-.5">JAVE</text>
    <text x="470" y="189" font-size="11" fill="#a09a9a">Go core</text>
    <text x="396" y="281">Ollama</text>
    <text x="549" y="281">Docker sandbox</text>
  </g>
  <g font-size="10.5" fill="#e23a52">
    <text x="480" y="119">WebSocket</text>
    <text x="334" y="232" text-anchor="start">local model</text>
    <text x="560" y="232" text-anchor="start">isolated run</text>
  </g>

  <text x="334" y="336" font-size="11" fill="#a09a9a">Go · Docker · Ollama · WebSocket · VS Code</text>
</svg>
